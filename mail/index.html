<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mail">
<meta name="description" content="A calm, minimal email client for Gmail.">
<title>Mail</title>
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/layout.css">
<script>
  // Apply the saved theme before first paint so the splash never flashes the wrong colour.
  try {
    var t = (JSON.parse(localStorage.getItem('mail.prefs') || '{}').theme) || 'system';
    if (t !== 'system') document.documentElement.dataset.theme = t;
  } catch (e) {}
</script>
<script src="config.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="splash" id="splash" role="img" aria-label="Mail">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="15" width="46" height="34" rx="4.5"/><path d="M11 18l21 15.5L53 18"/></svg>
  </div>
  <div class="app" id="app"></div>
  <noscript><p style="padding:24px">Mail needs JavaScript to run.</p></noscript>
</body>
</html>
